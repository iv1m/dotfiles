# Terminal
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -sg escape-time 0
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Gruvbox (dark). Status bar background is transparent so ghostty shows through.
set -g status-style "bg=default,fg=#ebdbb2"
set -g status-left ""
set -g status-left-length 0
set -g status-right ""
set -g status-right-length 100
set -g status-justify left

set -g window-status-separator " "
set -g window-status-format "#[bg=#3c3836,fg=#a89984,bold] #I "
set -g window-status-current-format "#[bg=#{?client_prefix,#fb4934,#{?#{==:#{pane_mode},copy-mode},#fabd2f,#d79921}},fg=#282828,bold] #I "

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#b8bb26"
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"
set -g mode-style "bg=#504945,fg=#fabd2f"

# Sessions
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Floax
set -g @floax-bind 'p'
set -g @floax-width '85%'
set -g @floax-height '80%'
set -g @floax-title " #{pane_current_path} "
set -g @floax-change-path 'true'

# Prefix: Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse
set -g mouse on

# Kill pane without confirmation
unbind x
bind x kill-pane

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes in current path
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# macOS
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Linux + Wayland
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Linux + X11
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Clipboard
set -g set-clipboard on
unbind -T copy-mode-vi MouseDragEnd1Pane

# Session tree
bind s choose-tree -sZ -O name

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# TPM must stay last
run '~/.config/tmux/plugins/tpm/tpm'
